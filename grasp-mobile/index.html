<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grasp">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Grasp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f0f;
    --surface:  #1a1a1a;
    --border:   #2e2e2e;
    --text:     #e8e8e8;
    --muted:    #888;
    --accent:   #5fa87f;
    --err:      #c0534a;
    --radius:   10px;
    --gap:      16px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    min-height: 100dvh;
    padding: max(env(safe-area-inset-top, 16px), 16px)
             max(env(safe-area-inset-right, 16px), 16px)
             max(env(safe-area-inset-bottom, 16px), 16px)
             max(env(safe-area-inset-left, 16px), 16px);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    max-width: 540px;
    margin: 0 auto;
  }

  .hidden { display: none !important; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    font-size: 1.1rem;
    line-height: 1;
    transition: color 0.15s;
  }
  .icon-btn:hover { color: var(--text); }

  /* ── Fields ── */
  .field { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  input, textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 12px 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  input[type="password"] { letter-spacing: 0.1em; }

  /* ── Buttons ── */
  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px;
    transition: opacity 0.15s, transform 0.1s;
    width: 100%;
    -webkit-appearance: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: #0f0f0f; }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: max(env(safe-area-inset-bottom, 24px), 24px);
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 0.9rem;
    white-space: nowrap;
    transition: transform 0.25s ease, opacity 0.25s ease;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error   { border-color: var(--err);    color: var(--err); }

  /* ── Settings hint ── */
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .spacer { flex: 1; }
</style>
</head>
<body>

<!-- ── Capture screen ── -->
<main id="capture-screen" class="screen hidden">
  <header>
    <h1>Grasp</h1>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <form id="capture-form">
    <div class="field">
      <label for="url">URL</label>
      <input id="url" name="url" type="url" placeholder="https://" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" placeholder="Page title">
    </div>

    <div class="field">
      <label for="tags">Tags</label>
      <input id="tags" name="tags" type="text" placeholder="comma, separated">
    </div>

    <div class="field">
      <label for="comment">Comment <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="comment" name="comment" placeholder="Notes…"></textarea>
    </div>

    <div class="spacer"></div>

    <button id="submit-btn" class="btn btn-primary" type="submit">Capture</button>
  </form>
</main>

<!-- ── Settings screen ── -->
<section id="settings-screen" class="screen hidden">
  <header>
    <h1>Settings</h1>
  </header>

  <form id="settings-form">
    <div class="field">
      <label for="endpoint">Server URL</label>
      <input id="endpoint" name="endpoint" type="url" placeholder="https://grasp.yourdomain.com" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="api-key">API Key</label>
      <input id="api-key" name="api-key" type="password" placeholder="your secret key" autocomplete="current-password">
    </div>

    <p class="hint">
      The API key is stored in your browser's local storage. Generate one on the
      server with <code>openssl rand -base64 32</code> and set
      <code>GRASP_API_KEY</code> in the systemd service environment.
    </p>

    <div class="spacer"></div>

    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
